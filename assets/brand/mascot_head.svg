<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 220 200" width="100%" style="overflow:visible;"><defs>
  <filter id="rough" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="{{ roughScale }}"/></filter>
  <filter id="rougher" x="-30%" y="-30%" width="160%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="{{ rougherScale }}"/></filter>
</defs>
          <g filter="url(#rough)" stroke="#f2f2ef" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
