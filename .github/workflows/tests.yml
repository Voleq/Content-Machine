# The offline suite, on every push (21).
#
# There was no CI. Fifty-five test files ran when somebody remembered, and a
# fresh environment reports a pile of failures that mean nothing — the kit is
# a gitignored build product, ffmpeg is not preinstalled anywhere, and the
# sample videos live in Git LFS. So "did this break anything" meant running
# the suite on the base commit too and diffing the failure sets, by hand.
#
# All three of those are one-time setup costs, and the kit build is cached on
# the hash of `kit/` — so a run that does not touch the kit reuses the plates
# and the whole job is the suite.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-latest
    # The suite alone ran past 40 minutes on a hosted runner, and both runs on
    # the default branch were cancelled at the old 45 with tests still going.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # The fifteen hold tests read `samples/*.mp4`, which are LFS
          # pointers without this and fail with misleading ffmpeg errors.
          lfs: true

      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Python dependencies
        # `--ignore-installed` because a plain install trips over the
        # distribution-owned `packaging` on Debian-family runners.
        run: pip install --ignore-installed -r requirements.lock.txt

      - name: Cache the ingested kit
        id: kit-cache
        uses: actions/cache@v4
        with:
          path: assets/plates
          # Everything the plates are built FROM. A kit change misses and
          # rebuilds; anything else hits and the ingest is skipped entirely.
          key: plates-${{ hashFiles('kit/**', 'scripts/ingest_kit.py', 'scripts/kit_engine.js', 'package-lock.json') }}

      - name: Node dependencies
        # Always, not only on a kit rebuild: `tests/test_budgets.py` runs the
        # engine driver itself, and it loads the rasteriser.
        run: npm ci

      - name: Ingest the kit
        if: steps.kit-cache.outputs.cache-hit != 'true'
        # The ingest runs the kit's own audit and `emit.js --check` on a staged
        # copy before drawing anything, so an engine and manifests from
        # different drops fail here rather than in a render. The driver draws
        # one family at a time and releases it before the next.
        run: python scripts/ingest_kit.py kit

      - name: Tests
        env:
          MOCK_MODE: "true"
        run: python -m pytest tests/ -q --maxfail=0
