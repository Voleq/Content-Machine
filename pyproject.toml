[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dennis"
version = "0.1.0"
description = "Dennis — Telegram-controlled, human-in-the-loop financial video pipeline (SHORT 9:16 + LONG 16:9)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# Every dependency is pinned exactly (hard requirement).
# Target: headless Linux VPS, Python 3.11+, FFmpeg 6+ (apt package, not a pip dep).
dependencies = [
    "python-telegram-bot[job-queue]==22.8", # async bot API v21+ (brings APScheduler + httpx)
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "httpx==0.28.1",                        # Pexels / StockTwits / ElevenLabs / Drive REST
    "pillow==12.3.0",                       # all text/chart/kit raster generation (no ImageMagick)
    "pandas==2.3.3",
    "openpyxl==3.1.5",                      # two-sheet company-data export reader
    "yfinance==1.5.1",                      # Yahoo predefined screens + EquityQuery
    "yahooquery==2.4.1",                    # fallback for yfinance screener quirks
    "google-auth==2.55.1",                  # Google Drive delivery (service account / refresh token)
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]
# MoviePy is deliberately OPTIONAL: every animated moment (row type-ons,
# scribbles, zoom-punches, flash stingers) is pre-rendered by Pillow into
# small alpha overlay clips and composited by FFmpeg, so the default install
# needs neither MoviePy nor ImageMagick. Install this extra only if you want
# to experiment with MoviePy-based animations.
moviepy = [
    "moviepy==2.2.1",
]
s3 = [
    "boto3==1.42.39",
]
# 10-K auto-screenshot pipeline: SEC pull + cheap LLM flagging + headless
# Chromium shots. Optional so the base install stays lean — the feature
# degrades to zero shots when absent. bootstrap.sh installs this and the
# browser (`playwright install --with-deps chromium`). httpx is already a base
# dependency; the SEC/LLM calls reuse it.
filings = [
    "playwright==1.61.0",
    "beautifulsoup4==4.15.0",
]
# Driving Excel for the data refresh (P3.1b). Windows-only by nature — the
# COM bridge does not exist elsewhere — and optional: on the Linux/WSL2
# target it never installs, `excel_available()` reports it as unavailable,
# and the manual upload path (now the primary route) carries on.
#
# NOT pinned exactly, unlike every other dependency here. `pywin32==313` was
# pinned to a version that does not exist — PyPI tops out at 312 — so the
# extra could never install at all. A floor is honest about what this is: an
# optional bridge for a platform the suite does not run on, where pinning a
# build number we cannot test buys nothing.
excel = [
    "pywin32>=306; sys_platform == 'win32'",
]
# YouTube upload + retention feedback (P3.5). Optional: without it the bot
# hands you the upload package to post by hand, exactly as before.
youtube = [
    "google-api-python-client==2.190.0",
    "google-auth-oauthlib==1.2.2",
]

[project.scripts]
dennis = "main:main"

[tool.setuptools]
packages = ["pipeline", "bot"]
py-modules = ["config", "main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The suite must run fully offline in MOCK_MODE with zero network calls.
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:telegram.*",
]
