[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dennis"
version = "0.1.0"
description = "Dennis — Telegram-controlled, human-in-the-loop financial video pipeline (SHORT 9:16 + LONG 16:9)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# Every dependency is pinned exactly (hard requirement).
# Target: headless Linux VPS, Python 3.11+, FFmpeg 6+ (apt package, not a pip dep).
dependencies = [
    "python-telegram-bot[job-queue]==22.8", # async bot API v21+ (brings APScheduler + httpx)
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "httpx==0.28.1",                        # Pexels / StockTwits / ElevenLabs / Drive REST
    "pillow==12.3.0",                       # all text/chart/kit raster generation (no ImageMagick)
    "pandas==2.3.3",
    "openpyxl==3.1.5",                      # two-sheet company-data export reader
    "yfinance==1.5.1",                      # Yahoo predefined screens + EquityQuery
    "yahooquery==2.4.1",                    # fallback for yfinance screener quirks
    "google-auth==2.55.1",                  # Google Drive delivery (service account / refresh token)
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]
# MoviePy is deliberately OPTIONAL: every animated moment (row type-ons,
# scribbles, zoom-punches, flash stingers) is pre-rendered by Pillow into
# small alpha overlay clips and composited by FFmpeg, so the default install
# needs neither MoviePy nor ImageMagick. Install this extra only if you want
# to experiment with MoviePy-based animations.
moviepy = [
    "moviepy==2.2.1",
]
s3 = [
    "boto3==1.42.39",
]
# 10-K auto-screenshot pipeline: SEC pull + cheap LLM flagging + headless
# Chromium shots. Optional so the base install stays lean — the feature
# degrades to zero shots when absent. bootstrap.sh installs this and the
# browser (`playwright install --with-deps chromium`). httpx is already a base
# dependency; the SEC/LLM calls reuse it.
filings = [
    "playwright==1.61.0",
    "beautifulsoup4==4.15.0",
]
# The free local voice (Piper) — what makes /draft and /proof both free AND
# listenable. Optional so the base install and CI stay lean: without it
# tier_for() falls back to the mock hum rather than to a paid generation, so
# absence costs quality, never money. bootstrap.sh installs it, downloads the
# voice model into assets/voices/, and requires a real test synthesis before it
# will write the settings that switch the tier on — a tier that reports success
# and delivers a hum is worse than one that is plainly absent. It warns rather
# than aborting when that fails: the same "absence costs quality, never money"
# is the reason an unusable voice must not cost the operator the whole install.
voice = [
    "piper-tts==1.6.0",
]
# YouTube upload + retention feedback (P3.5). Optional: without it the bot
# hands you the upload package to post by hand, exactly as before.
youtube = [
    "google-api-python-client==2.190.0",
    "google-auth-oauthlib==1.2.2",
]

[project.scripts]
dennis = "main:main"

[tool.setuptools]
packages = ["pipeline", "bot"]
py-modules = ["config", "main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The suite must run fully offline in MOCK_MODE with zero network calls.
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:telegram.*",
]
markers = [
    # A GATE, not a test. `audio_provenance` fails on a fresh checkout
    # because `assets/sfx/` ships ffmpeg oscillators with no SOURCES.json,
    # which is exactly the state that blocks a final render — so a green
    # suite here would be the suite lying about a production blocker.
    #
    # An operator clears it by running `scripts/fetch_sfx.py`. Anyone who
    # needs a clean run before that can deselect it:
    #
    #     pytest -m "not audio_provenance"
    #
    # Deselecting it does not clear the render block; only the fetch does.
    "audio_provenance: a build product the operator must fetch (P0b)",
]
